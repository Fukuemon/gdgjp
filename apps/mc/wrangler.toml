name = "gdgjp-mc"
main = "./workers/app.ts"
compatibility_date = "2026-07-28"
compatibility_flags = ["nodejs_compat"]

[alias]
"virtual:react-router/server-build" = "./build/server/index.js"

[vars]
ENVIRONMENT = "production"
APP_URL = "https://mc.gdgs.jp"
ACCOUNTS_URL = "https://accounts.gdgs.jp"
IDP_URL = "https://accounts.gdgs.jp"
IDP_CLIENT_ID = "mc"

[assets]
binding = "ASSETS"
directory = "./build/client"
# Controller and player sockets upgrade at /ws; that must reach the Worker (and
# the McRoom Durable Object) instead of being served as a static asset.
run_worker_first = ["/ws"]

[[routes]]
pattern = "mc.gdgs.jp"
custom_domain = true

[durable_objects]
bindings = [
  { name = "MC_ROOM", class_name = "McRoom" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["McRoom"]

# Relying-party auth tables (user, oidc_session) only. Playback state, played
# marks, loop settings, and the player token live in the McRoom Durable Object.
[[d1_databases]]
binding = "DB"
database_name = "gdgjp-mc-db"
database_id = "5d98925f-17a1-4658-aa97-8076946f0469"
migrations_dir = "./migrations"

# Audio of clips uploaded from the controller (key "clips/<id>"), served at
# /media/<id>. Their metadata is the uploaded_clip table in DB.
[[r2_buckets]]
binding = "AUDIO"
bucket_name = "gdgjp-mc-audio"

# Worker-to-Worker OIDC (discovery, token, UserInfo) stays on Cloudflare's
# internal network instead of looping through public HTTPS.
[[services]]
binding = "ACCOUNTS"
service = "gdgjp-accounts"

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true
